<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#161616" />
		<meta name="text-scale" content="scale" />
		
		<!-- Favicon & Search Engine Icons -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />

		<!-- Primary Meta Tags -->
		<meta name="title" content="Rocky Mountain Safety | Training & OQ | Durango, CO" />
		<meta name="description" content="Safety training, pipeline OQ evaluations, and mobile occupational health testing across the Four Corners from Rocky Mountain Safety in Durango, CO." />
		<meta name="author" content="Rocky Mountain Safety by Safe Hands" />

		<!-- Open Graph / Facebook / LinkedIn / WhatsApp (Search & Social Previews) -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Rocky Mountain Safety | Training & OQ | Durango, CO" />
		<meta property="og:description" content="Safety training, pipeline OQ evaluations, and mobile occupational health testing across the Four Corners from Rocky Mountain Safety in Durango, CO." />
		<meta property="og:image" content="/og-image.png" />
		<meta property="og:site_name" content="Rocky Mountain Safety" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Rocky Mountain Safety | Industrial Safety Training & Consulting" />
		<meta name="twitter:description" content="Workplace safety compliance, OSHA certification, hazard control, and technical safety training in Colorado." />
		<meta name="twitter:image" content="/og-image.png" />

		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
